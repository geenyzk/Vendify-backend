name: Deploy Site to live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vendify-backend-production
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, pdo, mysql
          coverage: none

      # - name: Copy .env
      #   run: cp .env.example .env

      - name: Install PHP dependencies
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          composer install --optimize-autoloader

      - name: Test PaymentPoint onboarding and recovery
        run: php artisan test tests/Feature/FundingAccountProviderStateTest.php tests/Feature/PaymentPointIntegrationTest.php tests/Feature/PaymentPointProvisioningMigrationTest.php

      - name: Remove development dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare Laravel storage and cache
        run: |
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT }}
          protocol: ftps
          server-dir: ${{ secrets.CPANEL_PATH_BACKEND }}
          local-dir: ./ # deploy everything
          exclude: |
            **/node_modules/**
            **/.git*
            .env # the server keeps its own .env — never overwrite it with the CI copy built from .env.example
