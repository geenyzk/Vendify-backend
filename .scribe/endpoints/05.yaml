name: 'Admin Controls'
description: |-

  Manage system service controls from the admin dashboard.
  These endpoints allow toggling service availability and retrieving grouped control data.
endpoints:
  -
    httpMethods:
      - GET
    uri: api/admin/controls
    metadata:
      groupName: 'Admin Controls'
      groupDescription: |-

        Manage system service controls from the admin dashboard.
        These endpoints allow toggling service availability and retrieving grouped control data.
      subgroup: ''
      subgroupDescription: ''
      title: 'Get all active service controls'
      description: |-
        Fetches and returns all service controls where `isDevLock` is false (0).
        The controls are grouped by `category` and `sub_category`.
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "status": "success",
            "message": "Request was successful",
            "data": {
              "control": {
                "Airtime": {
                  "MTN": [
                    {
                      "id": 1,
                      "name": "MTN Airtime",
                      "isActive": true,
                      "isDevLock": false,
                      "category": "Airtime",
                      "sub_category": "MTN"
                    }
                  ]
                }
              }
            }
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 1'
    controller: null
    method: null
    route: null
    custom: []
  -
    httpMethods:
      - PUT
      - PATCH
    uri: 'api/admin/controls/{id}'
    metadata:
      groupName: 'Admin Controls'
      groupDescription: |-

        Manage system service controls from the admin dashboard.
        These endpoints allow toggling service availability and retrieving grouped control data.
      subgroup: ''
      subgroupDescription: ''
      title: 'Update the active status of a service control'
      description: 'Toggle the `isActive` boolean status of a service control item by ID.'
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        name: id
        description: 'The ID of the service control.'
        required: true
        example: '15'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanUrlParameters:
      id: '15'
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      isActive:
        name: isActive
        description: 'Whether the service is active.'
        required: true
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanBodyParameters:
      isActive: true
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "status": "success",
            "message": "Request was successful",
            "data": []
          }
        headers: []
        description: ''
        custom: []
      -
        status: 404
        content: |-
          {
            "status": "fail",
            "message": "Service control not found",
            "data": []
          }
        headers: []
        description: ''
        custom: []
      -
        status: 422
        content: |-
          {
            "message": "The given data was invalid.",
            "errors": {
              "isActive": ["The isActive field is required."]
