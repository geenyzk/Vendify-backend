name: Customer
description: |-
  This endpoint converts a user's referral bonus balance into their wallet balance.
  The entire referral balance will be moved to the wallet if it's greater than zero.
endpoints:
  -
    httpMethods:
      - POST
    uri: 'api/customer/{id}/convert-referral'
    metadata:
      groupName: Customer
      groupDescription: |-
        This endpoint converts a user's referral bonus balance into their wallet balance.
        The entire referral balance will be moved to the wallet if it's greater than zero.
      subgroup: ''
      subgroupDescription: ''
      title: 'Convert Referral Balance to Wallet'
      description: ''
      authenticated: true
      deprecated: false
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        name: id
        description: 'The ID of the user.'
        required: true
        example: 5
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanUrlParameters:
      id: 5
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "message": "Referral balance converted successfully.",
            "user": {
              "id": 5,
              "name": "Jane Doe",
              "email": "jane@example.com",
              "wallet_balance": 1000.00,
              "referral_balance": 0
            }
          }
        headers: []
        description: ''
        custom: []
      -
        status: 404
        content: |-
          {
            "message": "User not found."
          }
        headers: []
        description: ''
        custom: []
      -
        status: 422
        content: |-
          {
            "message": "Referral balance is zero or insufficient."
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 1'
    controller: null
    method: null
    route: null
    custom: []
  -
    httpMethods:
      - POST
    uri: api/customer/account/upgrade
    metadata:
      groupName: Customer
      groupDescription: |-
        This endpoint allows an authenticated user to upgrade their account type (e.g., user, agent, bonanza, api).
        The system checks for sufficient wallet balance, deducts the upgrade cost, and updates the user type.
      subgroup: ''
      subgroupDescription: ''
      title: 'Upgrade Customer Account'
      description: ''
      authenticated: true
      deprecated: false
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      upgrade_to:
        name: upgrade_to
        description: 'The user level to upgrade to. Must be one of: user, agent, bonanza, api.'
        required: true
        example: agent
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanBodyParameters:
      upgrade_to: agent
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "message": "Successfully upgraded your account to agent.",
            "user": {
              "id": 1,
              "name": "John Doe",
              "email": "john@example.com",
              "wallet_balance": 1500.00,
              "user_type": "agent"
            }
          }
        headers: []
        description: ''
        custom: []
      -
        status: 400
        content: |-
          {
            "error": "You are already at this user level."
          }
        headers: []
        description: ''
        custom: []
      -
        status: 402
        content: |-
          {
            "error": "Insufficient wallet balance. Please fund your wallet."
          }
        headers: []
        description: ''
        custom: []
      -
        status: 404
        content: |-
          {
            "error": "Discount info not found."
          }
        headers: []
        description: ''
        custom: []
      -
        status: 422
        content: |-
          {
            "error": "Invalid upgrade option"
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 1'
    controller: null
    method: null
    route: null
    custom: []
